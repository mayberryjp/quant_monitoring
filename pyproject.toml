[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cron-runner"
version = "0.1.0"
description = "Scheduled Python script runner (cron container)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "bottle>=0.13",
  "waitress>=3.0",
  "SQLAlchemy>=2.0",
  "psycopg[binary]>=3.1",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "croniter>=2.0",
  "PyYAML>=6.0",
  "requests>=2.31"
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "webtest>=3",
  "ruff>=0.6",
  "mypy>=1.11",
  "bandit>=1.7"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
