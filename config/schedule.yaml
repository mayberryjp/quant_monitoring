timezone: "Asia/Tokyo"
jobs:
  - name: "daily_ingestion_report"
    script: "/app/scripts/daily_ingestion_report.py"
    schedule: "00 10 * * *"
    timezone: "Asia/Tokyo"
    args: []
    timeout_seconds: 300
    enabled: true
    allow_concurrent: false
    max_retries: 1
    retry_delay_seconds: 60
  - name: "sticky_notes_report"
    script: "/app/scripts/sticky_notes_report.py"
    schedule: "30 10 * * *"
    timezone: "Asia/Tokyo"
    args: []
    timeout_seconds: 300
    enabled: true
    allow_concurrent: false
    max_retries: 1
    retry_delay_seconds: 60
  - name: "streaming_status_report"
    script: "/app/scripts/streaming_status_report.py"
    schedule: "30 12 * * *"
    timezone: "Asia/Tokyo"
    args: []
    timeout_seconds: 300
    enabled: true
    allow_concurrent: false
    max_retries: 1
    retry_delay_seconds: 60
  - name: "daily_trades_report"
    script: "/app/scripts/daily_trades_report.py"
    schedule: "0 13 * * *"
    timezone: "Asia/Tokyo"
    args: []
    timeout_seconds: 300
    enabled: true
    allow_concurrent: false
    max_retries: 1
    retry_delay_seconds: 60
