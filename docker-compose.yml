services:
  cron-runner:
    image: ghcr.io/mayberryjp/cron-runner:latest
    environment:
      API_PORT: "8000"
      CRON_SCHEDULE_FILE: "/app/config/schedule.yaml"
      # Shared Postgres used by cron-runner's own job_runs table AND by
      # quant_symbols / quant_daily_bars / quant_momentum / quant_indicators
      # (read-only access for daily_ingestion_report.py)
      DATABASE_URL: "postgresql+psycopg://quant:quant_dev_password@quant-postgres:5432/quant"
      # OpenAI-compatible Ollama endpoint used to summarize ingestion run results
      OLLAMA_BASE_URL: "http://ollama:11434/v1"
      OLLAMA_MODEL: "llama3.1"
      OLLAMA_API_KEY: ""
      # Discord incoming webhook the daily ingestion report is posted to
      DISCORD_WEBHOOK_URL: "https://discord.com/api/webhooks/CHANGE_ME/CHANGE_ME"
    ports:
      - "8000:8000"
    volumes:
      # Mount the directory, not the single file: bind-mounting one file pins the
      # container to that file's inode, so an editor's atomic save (write-new + rename)
      # leaves the container reading stale content. Directory mounts resolve by path.
      - /docker/monitoring:/app/config:ro
